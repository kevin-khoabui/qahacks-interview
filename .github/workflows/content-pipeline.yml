name: QAHacks Interview Content Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose a controlled content operation"
        required: true
        type: choice
        options:
          - generate-1
          - generate-3
          - generate-5
          - review-1
          - review-3
          - review-5
          - list-review-articles
          - inspect-by-slug
          - apply-content-patch
          - publish-by-slug
      slug:
        description: "Required for inspect, patch, or publish actions"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: qahacks-interview-content
  cancel-in-progress: false

jobs:
  content:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Resolve batch size
        id: batch
        shell: bash
        run: |
          case "${{ inputs.action }}" in
            *-5) echo "count=5" >> "$GITHUB_OUTPUT" ;;
            *-3) echo "count=3" >> "$GITHUB_OUTPUT" ;;
            *) echo "count=1" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Generate safe drafts
        if: startsWith(inputs.action, 'generate-')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        shell: bash
        run: |
          for i in $(seq 1 "${{ steps.batch.outputs.count }}"); do
            echo "Generating draft $i/${{ steps.batch.outputs.count }}"
            npm run generate:draft -- --remote --confirm
          done

      - name: Review pending drafts
        if: startsWith(inputs.action, 'review-')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'gemini-2.5-flash' }}
        shell: bash
        run: |
          for i in $(seq 1 "${{ steps.batch.outputs.count }}"); do
            echo "Reviewing draft $i/${{ steps.batch.outputs.count }}"
            npm run review:draft -- --remote --confirm
          done

      - name: List reviewed articles
        if: inputs.action == 'list-review-articles'
        run: npm run list:review -- --remote --confirm

      - name: Validate slug input
        if: inputs.action == 'inspect-by-slug' || inputs.action == 'apply-content-patch' || inputs.action == 'publish-by-slug'
        shell: bash
        run: |
          if [ -z "${{ inputs.slug }}" ]; then
            echo "A slug is required for this action."
            exit 1
          fi

      - name: Inspect reviewed article
        if: inputs.action == 'inspect-by-slug'
        run: npm run inspect:review -- --slug "${{ inputs.slug }}" --remote --confirm

      - name: Apply curated content patch
        if: inputs.action == 'apply-content-patch'
        run: npm run patch:content -- --slug "${{ inputs.slug }}" --remote --confirm

      - name: Publish reviewed article
        if: inputs.action == 'publish-by-slug'
        run: npm run publish -- --slug "${{ inputs.slug }}" --remote --confirm
